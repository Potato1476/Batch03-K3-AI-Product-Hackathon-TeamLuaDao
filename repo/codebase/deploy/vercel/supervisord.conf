[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:web]
command=/app/deploy/vercel/start-web.sh
priority=1
autorestart=true
startretries=10
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:migrate]
command=/usr/local/bin/python /app/deploy/vercel/migrate.py
priority=5
autorestart=unexpected
startretries=10
startsecs=0
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:training-api]
command=/usr/local/bin/chan-training-api
priority=10
autorestart=true
startretries=10
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:intel]
command=/usr/local/bin/chan-intel-api
priority=10
autorestart=true
startretries=10
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:detection]
command=/usr/local/bin/chan-detection-api
priority=20
autorestart=true
startretries=10
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0

[program:gateway]
command=/usr/local/bin/chan-gateway
priority=30
autorestart=true
startretries=10
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0
