[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:training-api]
command=/usr/local/bin/chan-training-api
priority=10
autorestart=true
startretries=10
stdout_logfile=/tmp/training-api.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/training-api.stderr.log
stderr_logfile_maxbytes=0

[program:intel]
command=/usr/local/bin/chan-intel-api
priority=10
autorestart=true
startretries=10
stdout_logfile=/tmp/intel.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/intel.stderr.log
stderr_logfile_maxbytes=0

[program:detection]
command=/usr/local/bin/chan-detection-api
priority=20
autorestart=true
startretries=10
stdout_logfile=/tmp/detection.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/detection.stderr.log
stderr_logfile_maxbytes=0

[program:gateway]
command=/usr/local/bin/chan-gateway
priority=30
autorestart=true
startretries=10
stdout_logfile=/tmp/gateway.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/gateway.stderr.log
stderr_logfile_maxbytes=0

[program:web]
command=/app/deploy/vercel/start-web.sh
priority=40
autorestart=true
startretries=10
stdout_logfile=/tmp/web.stdout.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/web.stderr.log
stderr_logfile_maxbytes=0
