[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chan-ml"
version = "0.1.0"
description = "Privacy-preserving Vietnamese phishing signal classifier for CHAN"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
workbook = ["openpyxl>=3.1,<4"]

[project.scripts]
chan-generate = "chan_ml.synthetic:main"
chan-prepare-team-data = "chan_ml.team_dataset:main"
chan-audit-dataset = "chan_ml.audit_dataset:main"
chan-train = "chan_ml.train:main"
chan-evaluate = "chan_ml.evaluate:main"
chan-evaluate-product = "chan_ml.evaluate_product:main"
chan-evaluate-workbook = "chan_ml.evaluate_workbook:main"
chan-predict = "chan_ml.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
