name: chan

x-build: &repo-build
  context: ..

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chan
      POSTGRES_PASSWORD: chan
      POSTGRES_DB: chan
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./training_api/migrations/001_continuous_training.sql:/docker-entrypoint-initdb.d/001_continuous_training.sql:ro
      - ./gateway/migrations/002_public_v1.sql:/docker-entrypoint-initdb.d/002_public_v1.sql:ro
      - ./intel/migrations/001_threat_intel.sql:/docker-entrypoint-initdb.d/003_threat_intel.sql:ro
      - ./intel/migrations/002_prefix_v2.sql:/docker-entrypoint-initdb.d/004_intel_prefix_v2.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chan -d chan"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]

  training-api:
    build:
      <<: *repo-build
      dockerfile: codebase/training_api/Dockerfile
    environment:
      CHAN_DATABASE_URL: postgresql://chan:chan@postgres:5432/chan
      CHAN_TRAINING_API_KEYS: feed-ingest=local-dev-ingest-secret-value,ml-reviewer=local-dev-reviewer-secret
      CHAN_MODEL_ARTIFACT_ROOT: /var/lib/chan/model-registry
      CHAN_BASE_DATASET_PATH: /var/lib/chan/datasets/chan-synthetic.jsonl.gz
      CHAN_GOLDEN_DATASET_PATH: /var/lib/chan/datasets/frozen-golden.jsonl.gz
    expose: ["8001"]
    volumes:
      - model-registry:/var/lib/chan/model-registry
      - ./ml/data/generated:/var/lib/chan/datasets:ro
    depends_on:
      postgres:
        condition: service_healthy

  intel:
    build:
      <<: *repo-build
      dockerfile: codebase/intel/Dockerfile
    environment:
      CHAN_DATABASE_URL: postgresql://chan:chan@postgres:5432/chan
      CHAN_INTEL_API_KEYS: report-ingest=local-dev-intel-reporter-key
      CHAN_INTEL_USER_AGENT: chan-local/ops@example.org
      CHAN_LOOKUP_PREFIX_LENGTH: "5"
    expose: ["8002"]
    depends_on:
      postgres:
        condition: service_healthy

  detection:
    build:
      <<: *repo-build
      dockerfile: codebase/detection/Dockerfile
    environment:
      CHAN_TRAINING_API_URL: http://training-api:8001
      CHAN_TRAINING_API_KEY: local-dev-ingest-secret-value
      CHAN_INTEL_API_URL: http://intel:8002
      CHAN_DETECTION_API_KEY: local-dev-detection-secret
      CHAN_MODEL_POLL_SECONDS: "60"
      CHAN_BOOTSTRAP_MODEL_PATH: /app/ml/artifacts/chan-signal-model.joblib
      CHAN_BOOTSTRAP_MODEL_SHA256: 14a9c1d13855af3090255c481bc0e5be39f9d835c21ada41b3d7936764c11b8b
      CHAN_BOOTSTRAP_MODEL_VERSION: chan-signal-20260730.3
    expose: ["8003"]
    volumes:
      - model-registry:/var/lib/chan/model-registry:ro
    depends_on:
      - training-api
      - intel

  gateway:
    build:
      <<: *repo-build
      dockerfile: codebase/gateway/Dockerfile
    environment:
      CHAN_DATABASE_URL: postgresql://chan:chan@postgres:5432/chan
      CHAN_REDIS_URL: redis://redis:6379/0
      CHAN_RULES_DIR: /app/rules
      CHAN_OCR_PROVIDER: tesseract
      CHAN_OCR_LANGUAGE: vie+eng
      CHAN_OCR_TIMEOUT_SECONDS: "20"
      CHAN_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      CHAN_DETECTION_API_URL: http://detection:8003
      CHAN_DETECTION_API_KEY: local-dev-detection-secret
      CHAN_INTEL_API_URL: http://intel:8002
      CHAN_INTEL_API_KEY: local-dev-intel-reporter-key
      CHAN_TRAINING_API_URL: http://training-api:8001
      CHAN_TRAINING_API_KEY: local-dev-ingest-secret-value
    ports: ["8000:8000"]
    depends_on:
      - detection
      - redis
      - postgres

  web:
    build:
      <<: *repo-build
      dockerfile: codebase/apps/web/Dockerfile
    ports: ["3000:80"]
    depends_on:
      - gateway

volumes:
  postgres-data:
  model-registry:
