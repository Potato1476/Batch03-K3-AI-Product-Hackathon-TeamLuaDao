[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chan-training-api"
version = "0.1.0"
description = "Private scenario ingestion and continuous training service for CHAN"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[project.scripts]
chan-training-api = "chan_training_api.main:run"
chan-training-worker = "chan_training_api.daily_training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
