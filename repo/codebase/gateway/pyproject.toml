[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chan-gateway"
version = "0.1.0"
description = "CHẮN public /v1 API — gateway, detection engine, lookup service"
requires-python = ">=3.11,<3.14"
# chan-ml is a required import but is not listed here: it is a local path
# package, not published. Install it first with `pip install -e codebase/ml`,
# the same convention codebase/training_api follows.
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",             # /v1/feedback bridge to the training plane
  "psycopg[binary,pool]>=3.2,<4",
  "python-multipart>=0.0.20,<1", # /v1/ocr multipart upload
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
redis = ["redis>=5.0,<7"]
ocr = ["paddleocr>=2.9,<3", "paddlepaddle>=2.6,<3"]
dev = ["httpx>=0.28,<1", "pytest>=8,<9"]

[project.scripts]
chan-gateway = "chan_api.main:run"
chan-retention = "chan_api.retention:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: requires a live PostgreSQL reachable via CHAN_TEST_DATABASE_URL",
]
